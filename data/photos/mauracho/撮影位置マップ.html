const alts = PTS.map(p => p.alt).filter(a => a !== null);
const aMin = Math.min(...alts), aMax = Math.max(...alts);

// 低地=青緑 → 高地=橙赤 の連続スケール
function colorFor(a) {
  if (a === null) return '#8b93a1';
  const t = (a - aMin) / (aMax - aMin);
  const stops = [[19,78,120],[36,140,150],[128,178,110],[214,174,84],[196,94,58]];
  const x = t * (stops.length - 1), i = Math.min(Math.floor(x), stops.length - 2), f = x - i;
  const c = stops[i].map((v, j) => Math.round(v + (stops[i+1][j] - v) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

const gsi = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '地理院タイル' });
const gsiPhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
  maxZoom: 18, attribution: '地理院タイル（全国最新写真）' });
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' });
gsi.addTo(map);
L.control.layers({ '地理院 淡色地図': gsi, '航空写真': gsiPhoto, 'OpenStreetMap': osm }).addTo(map);

const track = L.polyline(PTS.map(p => [p.lat, p.lon]),
  { color: '#3c6fd0', weight: 2.5, opacity: .75 }).addTo(map);

const numLayer = L.layerGroup();
PTS.forEach((p, i) => {
  const m = L.circleMarker([p.lat, p.lon], {
    radius: p.video ? 8 : 6,
    color: '#fff', weight: 1.6,
    fillColor: colorFor(p.alt), fillOpacity: .95
  }).addTo(map);
  m.bindPopup(
    `<b>${p.name}</b>${p.video ? ' <span style="color:#6b7280">（動画）</span>' : ''}<br>` +
    `<span class="k">撮影日時</span>${p.time}<br>` +
    `<span class="k">緯度経度</span>${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}<br>` +
    `<span class="k">標高</span>${p.alt === null ? '-' : p.alt.toFixed(1) + ' m'}<br>` +
    `<span class="k">撮影順</span>${i + 1} / ${PTS.length}<br>` +
    `<a href="https://www.google.com/maps?q=${p.lat},${p.lon}" target="_blank" rel="noopener">Google マップで開く</a>`
  );
  m.bindTooltip(p.name, { direction: 'top', offset: [0, -6] });
  L.marker([p.lat, p.lon], { interactive: false, icon: L.divIcon({
    className: '', html: `<div style="font:600 10px/1 -apple-system,sans-serif;color:#1d2126;
      background:rgba(255,255,255,.82);border-radius:3px;padding:2px 3px;white-space:nowrap">${i+1}</div>`,
    iconAnchor: [-6, 16] }) }).addTo(numLayer);
});

function fit() {
  const wide = window.innerWidth > 600;
  map.fitBounds(track.getBounds(), {
    paddingTopLeft: wide ? [300, 40] : [40, 40],
    paddingBottomRight: wide ? [60, 40] : [40, 300]
  });
}
fit();

document.getElementById('sub').textContent = PTS[0].time.slice(0, 10).replace(/:/g, '/') + ' 撮影 ・ ' + PTS.length + ' 地点';
document.getElementById('nPhoto').textContent = PTS.filter(p => !p.video).length + ' 件';
document.getElementById('nVideo').textContent = PTS.filter(p => p.video).length + ' 件';
document.getElementById('alt').textContent = aMin.toFixed(0) + ' – ' + aMax.toFixed(0) + ' m';
document.getElementById('aMin').textContent = aMin.toFixed(0) + ' m';
document.getElementById('aMax').textContent = aMax.toFixed(0) + ' m';
document.getElementById('scale').innerHTML =
  Array.from({ length: 40 }, (_, i) => `<i style="background:${colorFor(aMin + (aMax - aMin) * i / 39)}"></i>`).join('');

document.getElementById('tTrack').onchange = e => e.target.checked ? track.addTo(map) : map.removeLayer(track);
document.getElementById('tNum').onchange = e => e.target.checked ? numLayer.addTo(map) : map.removeLayer(numLayer);
</script>
